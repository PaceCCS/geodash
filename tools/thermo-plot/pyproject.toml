[project]
name = "thermo-plot"
version = "0.1.0"
description = "Generate cached thermodynamic grids and plots from Multiflash-like backends."
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "onnx>=1.18,<2",
  "zarr>=3.1,<4",
]

[project.scripts]
thermo-plot = "thermo_plot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermo_plot"]
